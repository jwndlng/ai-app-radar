name: PR Conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            build
            ci
            docs
            style
            refactor
            perf
            test

  auto-label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Apply type label and breaking-change label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          TYPE=$(echo "$PR_TITLE" | grep -oP '^[a-z]+(?=[\(!:])')
          if [ -n "$TYPE" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$TYPE" || true
          fi
          if echo "$PR_TITLE" | grep -qP '^[a-z]+(\([^)]+\))?!:'; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "major" || true
          fi
